<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #f8f9fa;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1877f2, #0d65d9);
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon { font-size: 22px; }
    .header h1 { font-size: 15px; font-weight: 600; }
    .header p { font-size: 11px; opacity: 0.85; margin-top: 2px; }

    /* Status Bar */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid #e4e6ea;
      background: white;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.green { background: #31a24c; }
    .status-dot.red { background: #e41e3f; }
    .status-dot.gray { background: #8a8d91; }
    .status-text { flex: 1; }
    .status-label { font-weight: 600; }
    .status-detail { font-size: 11px; color: #65676b; margin-top: 1px; }

    /* Content */
    .content { padding: 12px 16px; }
    
    /* Sync Info */
    .sync-info {
      background: white;
      border: 1px solid #e4e6ea;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 12px;
      color: #65676b;
    }
    .sync-info .label { font-weight: 600; color: #1a1a1a; }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 9px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #1877f2; color: white; }
    .btn-secondary { background: #e4e6ea; color: #1a1a1a; }
    .btn-warning { background: #f0ad4e; color: white; }

    /* Toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-top: 1px solid #e4e6ea;
      margin-top: 4px;
    }
    .toggle-label { font-size: 12px; font-weight: 500; }
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #ccc;
      border-radius: 22px;
      cursor: pointer;
      transition: 0.3s;
    }
    .toggle-slider:before {
      content: "";
      position: absolute;
      height: 16px;
      width: 16px;
      right: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.3s;
    }
    .toggle input:checked + .toggle-slider { background: #1877f2; }
    .toggle input:checked + .toggle-slider:before { transform: translateX(-18px); }

    /* Settings */
    .settings {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #e4e6ea;
    }
    .settings-label { font-size: 11px; color: #65676b; margin-bottom: 4px; }
    .settings-input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #dddfe2;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
      direction: ltr;
      text-align: left;
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-left: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Message */
    .message {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .message.success { background: #e6f4ea; color: #1e7e34; }
    .message.error { background: #fce8e6; color: #c62828; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <span class="header-icon">🍪</span>
    <div>
      <h1>PartnerCalc Cookie Sync</h1>
      <p>סנכרון אוטומטי של Cookies לפייסבוק</p>
    </div>
  </div>

  <!-- Status -->
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-text">
      <div class="status-label" id="statusLabel">בודק...</div>
      <div class="status-detail" id="statusDetail"></div>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <!-- Message -->
    <div class="message" id="message" style="display:none"></div>

    <!-- Sync Info -->
    <div class="sync-info">
      <div><span class="label">סנכרון אחרון:</span> <span id="lastSync">-</span></div>
      <div><span class="label">Cookies:</span> <span id="cookieCount">-</span></div>
    </div>

    <!-- Buttons -->
    <button class="btn btn-primary" id="syncBtn" disabled>
      🔄 סנכרן עכשיו
    </button>

    <button class="btn btn-warning" id="openFbBtn" style="display:none">
      🌐 פתח פייסבוק להתחברות
    </button>

    <!-- Auto Sync Toggle -->
    <div class="toggle-row">
      <span class="toggle-label">סנכרון אוטומטי</span>
      <label class="toggle">
        <input type="checkbox" id="autoSyncToggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <!-- Backend URL -->
    <div class="settings">
      <div class="settings-label">Backend URL:</div>
      <input type="text" class="settings-input" id="backendUrl" value="http://localhost:8000" />
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>

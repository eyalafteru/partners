# 🚀 Auto Deploy to Production Server
# כל push ל-main = deploy אוטומטי לשרת

name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔗 Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 49.13.31.182
          username: root
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /opt/partnercalc-os
            
            echo "📥 Pulling latest code..."
            git pull origin main
            
            echo "🔨 Building and starting containers..."
            docker compose -f docker/docker-compose.prod.yml up -d --build --force-recreate
            
            echo "⏳ Waiting for services to start..."
            sleep 10
            
            echo "🔄 Restarting nginx to refresh DNS..."
            docker restart partnercalc-nginx
            
            echo "✅ Deploy completed!"
            docker ps --format 'table {{.Names}}\t{{.Status}}'
            
            echo "🔍 Health check..."
            curl -s http://localhost/api/stats/active-scans > /dev/null && echo "✅ API is healthy!" || echo "❌ API check failed"
